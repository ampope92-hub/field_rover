name = "field-rover"

# The one path the separate verifier collects from the agent's final container. Top level on
# purpose: an artifacts list under [verifier] is dropped.
artifacts = [
    "/app/rover/src/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Software"
subcategory = "Data engineering"
tags = ["ocaml", "odometry", "rtk-gnss", "telemetry", "clock-alignment"]
languages = ["ocaml"]
difficulty = "core"
expert_time_estimate_hours = 5
is_multi_container = true
difficulty_explanation = """
The agent writes an OCaml tool that reconstructs a field robot's survey run from the telemetry its base station archived, and reports how far the rover drove, how many radio frames never arrived, and for every tree the rover tagged, when, at what odometer reading and where. Each part of the rover reports on its own terms, and the spec gives each as a fact about the machine: the mission computer's clock was stepped once mid run; the drive controller counts quadrature edges on 16-bit counters, has one motor mounted mirrored and browned out once; the RTK receiver keeps GPS time with a 10-bit week and drops to float under the canopy; the camera re-tags a blurred tree from the next alley; and the radio numbers its frames on a 16-bit counter and, after a dropout, re-sends what it holds newest first. The three runs are simulated. solution/generate_run.py drives the rover, the receiver, the camera and the radio, and writes the expected report with a rule book that was written before the OCaml and knows nothing of the simulation.

The reconstruction is the work, and each misreading has been measured against the rule book. On the shipped run the step is backwards, so deciding which stamps it covers by comparing them with the step's own stamp gets 30 of the 830 graded fields wrong, and walking the drive frames in stamp order gets 161; measuring the boot after the brownout from its first frame the archive holds instead of from zero, 50; OCaml's truncating division on the interpolated positions, 164; GPS time taken as UTC, 406; the week number read as a full week, 396, or held at the first fix's week across the week change, 194; each wheel's travel added on its own so that pivot turns count, 194; one count per encoder line, 208; the mirrored motor ignored, 208; one circumference for both wheels, 193; float fixes interpolated, 14, and a missing epoch bridged, 4; a tree placed at its blurred first tag, 42, and a never-sharp tree kept, 3; the odometer read at the frame strictly before the tag, 1; and copies counted as received moves the lost count. Each of the thirty misreadings calibrate.py expresses moves at least one graded field on every one of eight fresh seeds of each run that carries its case; the held-back run has another calibration, the other motor mirrored, a longer backward step, another date and other tree numbers.

None of the facts is hard alone. What slows an expert is that they feed each other: the step decides where each drive frame sits on the true clock, and so the odometer at each tag; the newest-first refill decides the order the frames are walked in and where a boot seems to restart; the frames lost after the brownout decide where that boot's travel starts; and the leap seconds, the week count and the step together decide which two fixes bracket a tag. A report can sit close to the receiver's track all the way round, pass every check the agent can make on the box, and still be wrong on the run it cannot see. This is the job of the engineer who owns a field robot's logs and has to say why the odometer, the receiver and the task log disagree before anyone trusts a survey.
"""
solution_explanation = """
solve.sh drops solution/src/main.ml in place of the stub and runs build.sh, which uses the same ocamlopt line the grader does. It opens the archive named by TELEMETRY_HOST (an address or a name) and TELEMETRY_PORT, asks for batches of up to 1000 frames from the cursor start, follows each next cursor to done. Frames are kept once by their text, their 16-bit numbers are unwrapped along arrival order to the value nearest the one before, and they are sorted back into the order the rover made them. Stamps from before the SYS frame in that order get its step added. The CFG frame gives four counts per line times gear counts per wheel turn, the two circumferences and the mirrored side. Drive frames are walked in order with every counter difference read the short way round, the mirrored side negated, a boot restarting at a fall in up with the counters from zero, and the absolute value of left travel plus right travel summed exactly, so the total and each odometer reading is one floor division at the end. Fixes go on the UTC clock from week plus 2048, time of week and 18 leap seconds. For each tree with a sharp tag, the odometer is read at the last drive frame at or before the tag, and the position is interpolated between the epoch at or before the tag and the next one when both fixes are held and fixed, with a floor division that rounds toward minus infinity. The report is printed as one line. It equals the rule book's report on all three runs; the rule book is Python, in solution/generate_run.py, and calibrate.py runs it with one reading at a time switched to a plausible wrong one.
"""
verification_explanation = """
tests/test.sh and tests/test_outputs.py grade in their own container, from the one collected path, /app/rover/src, over eighteen checks and three graded runs. Before each run the verifier compiles the tool itself from a root-owned copy: everything under src but main.ml is deleted first, and the compile is the one the spec states, as an unprivileged user, so a C stub, an object or a second module never reaches the compiler.

The expected reports were written once, by the rule book, when the runs were generated, and the oracle is cross-checked by two independent implementations of SPEC.md: the OCaml reference's report for each run, stored beside them at generation time, must equal them. Both sit in the verifier image where only root can open them, and no code at grading time works a report out. Each run talks to an archive the verifier starts from its own copy, with a batch size the agent's environment never used: the shipped run on 127.0.0.2, a held-back run of 92,183 frames with another calibration, mirrored side, step, date and tree numbers on 127.0.0.1, and a short run with a forward step reached by a host name the verifier puts in its hosts file. distance_mm, lost_frames and every tree row are compared for exact equality, after a shape check on the one line of JSON; a run killed at its 120 s limit fails.

The agent's program runs in the container that holds the goldens, so the compile and the runs go through setpriv as an unprivileged user with groups cleared; the tests, the runs, the service and the log directory are closed to that user and probed first, and a run that can still reach one scores 0. While the tool runs every other program on the box loses its group and other execute bits, the tool is a static binary, and it runs as a user id drawn for that run, and anything still running under that id afterwards is killed. Every entry on root's PATH must be root-owned and closed to others, pytest starts by absolute path with -P, every file the tests read is opened with O_NOFOLLOW, and only root writes the reward.

Coverage is counted from the runs, not assumed. One check per run reads the frames and requires the step's sign (backward on the shipped and held-back runs, with stamps made before it that read later than it), copies and a newest-first refill, the frame number and both counters wrapping, one brownout whose first frames never arrived, the GPS week turning over where the run crosses it, float, lost and missing fixes beside sharp tags (on the short run also standalone and none, and a tag on an epoch), a brownout there that only the fall in up marks, retaken, never-sharp and drive-aligned tags, and negative grid positions. Another requires each archive's log to show every frame fetched through cursors it handed out and no request refused, and one that the short run reached its archive by name. Twelve variants of the reference with one reading changed each, and a frozen copy of the shipped report, all scored 0 through this verifier; the reference scored 1.
"""
relevant_experience = """
I have looked after the logs of an outdoor field robot, a differential-drive platform with RTK and a radio link back to a base station, and most of what went into this task is from that work: the computer whose battery clock was wrong until the time service stepped it, the encoder counted on every quadrature edge, the motor controller mounted mirror image on one side, the brownout that zeroes the counters, the receiver that keeps GPS time and drops to float under trees, and the telemetry radio that fills in a gap newest first. Before a survey from such a robot is trusted, somebody has to put all of those on one clock and one odometer. For every fact in the spec I made sure the runs contain a stretch where getting that one fact wrong, and nothing else, puts a number in the report off.
"""

[verifier]
timeout_sec = 1800
environment_mode = "separate"
network_mode = "public"

[agent]
timeout_sec = 5400
network_mode = "public"

[environment]
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
